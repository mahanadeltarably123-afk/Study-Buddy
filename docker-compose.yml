version: '3.8'

services:
  study-buddy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: study-buddy-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - AI_PROVIDER=heuristic # 'heuristic', 'gemini', 'openai', 'groq', 'ollama'
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    volumes:
      - study-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  study-data:
    driver: local
